server:
  port: 8081
  tomcat:
    uri-encoding: UTF-8

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_study_teacher?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true&connectionCollation=utf8mb4_unicode_ci&characterSetResults=UTF-8
    username: root
    password: ${DB_PASSWORD:your_db_password}

  sql:
    init:
      mode: never
      schema-locations: classpath:init.sql
      encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  http:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
      force-request: true
      force-response: true

mybatis-plus:
  mapper-locations: classpath*:com/huadi/intelligentteachingplatform/mapper/*.xml
  type-aliases-package: com.huadi.intelligentteachingplatform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    charset: UTF-8
  global-config:
    db-config:
      id-type: auto
      table-underline: true

file:
  upload:
    path: uploads/

deepseek:
  api-key: ${DEEPSEEK_API_KEY:your_deepseek_api_key}
  api-url: https://api.deepseek.com/chat/completions

baidu:
  ocr:
    app-id: ${BAIDU_OCR_APP_ID:your_baidu_app_id}
    api-key: ${BAIDU_OCR_API_KEY:your_baidu_api_key}
    secret-key: ${BAIDU_OCR_SECRET_KEY:your_baidu_secret_key}
    connection-timeout: 5000
    read-timeout: 10000

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:5000}

jwt:
  secret: ${JWT_SECRET:your_jwt_secret}
  expire-hours: 24
